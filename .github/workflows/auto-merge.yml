name: auto-merge

# Liga o auto-merge nos PRs abertos da org que o Argos aprovou, para que um PR aprovado e com o CI verde
# entre na main sem ninguém clicar (barte-ai-services/infra#183). O ruleset de cada repo exige só os
# checks de CI; o approve do Argos sobre o head é este workflow que exige (#56).
#
# - Passa por todo repositório não arquivado com allow_auto_merge ligado. O template
#   (barte-ai-platform) tem a setting desligada de propósito, pela tabela .github/platform-repos.json
#   do infra: nele o merge é um clique do Fernando, e este workflow não toca.
# - Pula PR em draft, PR de fork e PR com o label argos:hold.
# - Só liga o auto-merge num PR com um veredito approve do Argos sobre o head atual (#56): o comentário
#   do Argos das sessões (`<!-- ahrena-review:<pr>:<sha> verdict=approve -->`, de quem escreve no repo)
#   ou o do Argos de CI (`<!-- ahrena-review -->`, do app, com 0 bloqueantes). Entre os vereditos sobre
#   o head, o mais recente decide. Um commit novo depois do approve o invalida; a única exceção é o head
#   que só mescla a base sobre o commit aprovado (o mesmo critério do argos.yml, #39). Sem veredito, com
#   outro veredito ou na dúvida, o PR espera. A regra está em .github/scripts, com os testes ao lado.
# - Liga com --match-head-commit, e relê os PRs que já têm auto-merge: um push de quem escreve no repo
#   não desliga o auto-merge no GitHub, então um PR que perdeu o approve tem o auto-merge desligado.
# - Um PR atrás da main (BEHIND), num repo que exige a branch atualizada, tem a branch atualizada depois
#   de o auto-merge estar ligado. O update mescla a base, nunca faz rebase: o head novo herda o approve.
# - PR empilhado (stack) não aceita auto-merge no GitHub: é relatado e seguido adiante.
#
# Roda com o token do app de release (herald-barte), instalado em todos os repos, para o merge disparar
# os workflows de push da main, o que um merge feito pelo GITHUB_TOKEN não faz.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: token do app de release
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: liga o auto-merge nos PRs abertos
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ARGOS_APP: argos-by-ahrena[bot]
        run: |
          set -uo pipefail
          scripts="$GITHUB_WORKSPACE/.github/scripts"
          enabled=0 disabled=0 updated=0 skipped=0 waiting=0
          # O fetch de um repo, para ver se o head só mescla a base sobre o commit aprovado, autentica
          # pelo ambiente, sem o token na linha de comando.
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          repos="$(gh repo list "$OWNER" --limit 500 --no-archived --json name --jq '.[].name')"
          for repo in $repos; do
            settings="$(gh api "repos/$OWNER/$repo")" || continue
            [ "$(jq -r '.allow_auto_merge' <<<"$settings")" = "true" ] || continue
            method="$(jq -r 'if .allow_merge_commit then "--merge" elif .allow_squash_merge then "--squash" else "--rebase" end' <<<"$settings")"
            # PR de fork fica de fora: o sha curto do marcador das sessões não basta contra um commit
            # forjado com o mesmo prefixo.
            prs="$(gh pr list -R "$OWNER/$repo" --state open --limit 200 \
              --json number,isDraft,isCrossRepository,autoMergeRequest,mergeStateStatus,labels,headRefOid,baseRefName \
              --jq '.[] | select(.isDraft | not) | select(.isCrossRepository | not)
                | select([.labels[].name] | index("argos:hold") | not)
                | "\(.number)\t\(.autoMergeRequest != null)\t\(.mergeStateStatus)\t\(.headRefOid)\t\(.baseRefName)"')" || continue
            unset writer; declare -A writer=()
            while IFS=$'\t' read -r n auto state head base_ref; do
              [ -n "$n" ] || continue
              # O veredito do Argos sobre o head atual decide (#56), também num PR que já tem auto-merge:
              # um push de quem escreve no repo não desliga o auto-merge. Uma leitura que falha é espera.
              if input="$(gh api --paginate --slurp "repos/$OWNER/$repo/issues/$n/comments" \
                  | jq -c --argjson pr "$n" --arg head "$head" --arg app "$ARGOS_APP" \
                    '{pr: $pr, head: $head, app: $app, writers: [], labels: [], comments: (add // [])}')"; then
                for login in $(jq -r '[.comments[].user.login] | unique | .[]' <<<"$input"); do
                  if [ -z "${writer[$login]+x}" ]; then
                    perm="$(gh api "repos/$OWNER/$repo/collaborators/$login/permission" --jq '.permission' 2>/dev/null)" || perm=""
                    case "$perm" in admin|maintain|write) writer[$login]=1 ;; *) writer[$login]=0 ;; esac
                  fi
                  [ "${writer[$login]}" = 1 ] && input="$(jq -c --arg l "$login" '.writers += [$l]' <<<"$input")"
                done
                decision="$(jq -r -f "$scripts/argos-verdict.jq" <<<"$input")" || decision="wait o filtro falhou"
              else
                decision="wait não li os comentários"
              fi
              # Um approve de um commit anterior vale quando o head só mescla a base sobre ele: é o head
              # que o update-branch abaixo escreve.
              if [ "${decision%% *}" = stale ]; then
                read -r _ approved why <<<"$decision"
                gitdir="$RUNNER_TEMP/$repo.git"
                if [ ! -d "$gitdir" ]; then git init -q --bare "$gitdir"; fi
                if base="$(gh api "repos/$OWNER/$repo/commits/$base_ref" --jq '.sha')" \
                  && git --git-dir="$gitdir" fetch -q --no-tags "https://github.com/$OWNER/$repo" "$head" "$base" 2>/dev/null \
                  && bash "$scripts/only-base-merges.sh" "$gitdir" "$approved" "$head" "$base" 2>/dev/null; then
                  decision="approve ${approved:0:7}, e o head ${head:0:7} só mescla a base"
                else
                  decision="wait $why"
                fi
              fi
              if [ "${decision%% *}" != approve ]; then
                waiting=$((waiting + 1)); echo "$repo#$n: espera — ${decision#* }"
                if [ "$auto" = true ]; then
                  if gh pr merge "$n" -R "$OWNER/$repo" --disable-auto >/dev/null 2>&1; then
                    disabled=$((disabled + 1)); echo "$repo#$n: auto-merge desligado"
                  else
                    echo "::warning::$repo#$n: o auto-merge está ligado sem approve e não desligou"
                  fi
                fi
                continue
              fi
              if [ "$auto" != true ]; then
                if out="$(gh pr merge "$n" -R "$OWNER/$repo" --auto "$method" --match-head-commit "$head" 2>&1)"; then
                  enabled=$((enabled + 1)); echo "$repo#$n: auto-merge ligado — ${decision#* }"
                else
                  skipped=$((skipped + 1)); echo "$repo#$n: não ligou — $(head -1 <<<"$out")"; continue
                fi
              fi
              if [ "$state" = "BEHIND" ] && gh pr update-branch "$n" -R "$OWNER/$repo" >/dev/null 2>&1; then
                updated=$((updated + 1))
              fi
            done <<<"$prs"
          done
          echo "auto-merge ligado em $enabled PR(s) e desligado em $disabled; $waiting esperando o approve do Argos no head; $updated branch(es) atualizada(s); $skipped não aceitaram." | tee -a "$GITHUB_STEP_SUMMARY"
