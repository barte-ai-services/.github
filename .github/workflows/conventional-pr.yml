name: conventional-pr

# Reusable: valida Conventional Commits num PR — título + commits.
# Começa em modo warn (apenas avisa, não bloqueia). Vire mode=block quando o time estiver aderente.
#
# Ativação no repo chamador (.github/workflows/pr-conventions.yml):
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   permissions:
#     pull-requests: read
#     contents: read
#   jobs:
#     conv:
#       uses: barte-ai-services/.github/.github/workflows/conventional-pr.yml@main
#       with:
#         mode: warn   # troque para block quando quiser travar

on:
  workflow_call:
    inputs:
      mode:
        description: "block (falha o check) ou warn (apenas avisa, não bloqueia)"
        type: string
        default: warn
      require_scope:
        description: "exige escopo no título (ex.: feat(api): ...)"
        type: boolean
        default: false

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title:
    name: título (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Valida título do PR
        id: lint
        uses: amannn/action-semantic-pull-request@v5
        continue-on-error: ${{ inputs.mode == 'warn' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # tipos canônicos da Barte (Conventional Commits)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: ${{ inputs.require_scope }}
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            O assunto "{subject}" deve começar em minúscula e não terminar com ponto.
          validateSingleCommit: false
      - name: Aviso (modo warn)
        if: ${{ inputs.mode == 'warn' && steps.lint.outcome == 'failure' }}
        run: echo "::warning title=conventional-pr::Título fora do Conventional Commits (modo warn — não bloqueia). Padrão: tipo(escopo opcional): assunto."

  commits:
    name: commits (commitlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Garante config do commitlint
        run: |
          if ls commitlint.config.* .commitlintrc* >/dev/null 2>&1; then
            echo "Config do commitlint encontrada no repo."
          else
            echo "Sem config no repo — usando default config-conventional."
            printf "module.exports = { extends: ['@commitlint/config-conventional'] };\n" > commitlint.config.js
          fi
      - name: Instala commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint dos commits do PR
        continue-on-error: ${{ inputs.mode == 'warn' }}
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
