name: argos

# Reusable: o Argos, o revisor da Ahrena (ahrenatechnology/ahrena-agents), lê o PR contra as regras do
# ahrena-framework e publica o parecer no PR. É a primeira coisa que olha um PR na Barte: roda em paralelo
# ao CI e não soma tempo a ele.
#
# O Argos só lê: as ferramentas dele são Read, Grep e Glob, ele não sobe a aplicação, não builda e não roda
# teste.
#
# Desde a v1.3.0, o Argos lê o resultado das outras checagens do commit antes de dar o parecer, e espera
# até 15 min que elas terminem. Uma checagem vermelha vira achado bloqueante e o PR fica para uma pessoa.
# Para ler, o caller dá ao workflow `checks: read` e `statuses: read`. Sem essas permissões, o Argos revisa
# como antes e o comentário diz que o parecer não considera o CI. O reusable não pede as duas permissões:
# um reusable que pede mais do que o caller dá derruba o workflow.
#
# Quem decide o merge é o parecer do Argos, e não o Decisor (decisão do Fernando de 12/11/2026, em
# barte-ai-services/.github#45):
#   - approve com 0 bloqueantes e warnings: o Erodos faz uma rodada de autofix dos warnings mecânicos
#     (kind como), num commit que o app empurra para a branch do PR. Esse commit dispara o CI e uma nova
#     revisão, e é ela que decide;
#   - approve com 0 bloqueantes, sem warnings ou depois da rodada: cada warning que sobrou vira uma issue de
#     follow-up no repositório do PR, ligada a ele, e o auto-merge é ligado. Não há hold;
#   - qualquer outro parecer (bloqueante, request_changes, comment, o Argos que não rodou): argos:hold.
# O Decisor ainda pergunta ao Clef o risco e as probabilidades, e a resposta vai no parecer, só como
# informação.
#
# O auto-merge (squash) é ligado com o token do app do Argos: o GitHub faz o merge quando os checks
# obrigatórios do ruleset passam, e não antes. O token tem de ser o do app, e não o github.token: um merge
# feito pelo github.token não dispara os workflows da main, e um push dele (o do Erodos) não dispararia a nova
# revisão. Num repo com o auto-merge desligado (o template), ou sem o app, o passo avisa e o PR espera um
# humano. Para desligar num repo, o caller passa auto-merge: false; para desligar o autofix, fix: false. O app
# precisa de Contents: write e Pull requests: write. Os follow-ups saem com o token do app quando ele tem
# Issues: write; senão, com o github.token, quando o caller dá issues: write; senão, ficam listados no parecer
# e o merge segue igual. O hold, quando existe, é aplicado e removido pelo app.
#
# Precisa da variable de org CLOUDFLARE_ACCOUNT_ID e do secret CLOUDFLARE_API_TOKEN (escopo Workers AI).
# Sem eles, ou com o Clef fora, a decisão é hold_for_human, e a review sai do mesmo jeito.
#
# Dois modos:
#   comment  o parecer vai como comentário e o check fica verde. É o modo de calibrar (o default).
#   block    um achado blocking deixa o check vermelho, e o ruleset que exige o check segura o merge.
#
# Identidade: o parecer sai como o app «Argos, by Ahrena» (argos-by-ahrena) quando a org tem a variable
# ARGOS_APP_ID e o secret ARGOS_APP_PRIVATE_KEY, e o app está instalado no repo. Sem eles, sai como
# github-actions[bot], e a review roda do mesmo jeito.
#
# Ativação no repo chamador (.github/workflows/argos.yml), também em workflow-templates/argos.yml:
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:     # obrigatório e explícito: o reusable herda o que o caller dá
#     contents: read
#     pull-requests: write
#     issues: write   # os follow-ups, enquanto o app do Argos não tem Issues: write
#     checks: read
#     statuses: read
#   jobs:
#     argos:
#       uses: barte-ai-services/.github/.github/workflows/argos.yml@main
#       secrets:
#         claude-token: ${{ secrets.BARTE_ARGOS_CLAUDE_TOKEN || secrets.BARTE_HAROLD_CLAUDE_TOKEN }}
#         argos-app-private-key: ${{ secrets.ARGOS_APP_PRIVATE_KEY }}
#         cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
# Os secrets vão pelo nome, e não por `secrets: inherit`: o reusable recebe só os três que usa. O token do
# Claude é o secret de org BARTE_ARGOS_CLAUDE_TOKEN (claude setup-token), visível aos repos privados;
# enquanto ele não existe, vale o BARTE_HAROLD_CLAUDE_TOKEN.
#
# Modo pull_request_target + environment (barte-ai-services/.github#50): para um repo cujo secret do app do
# Argos mora num environment, e não na org. O caller troca o gatilho e passa o nome do environment: (#50)
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, ready_for_review]
#   jobs:
#     argos:
#       uses: barte-ai-services/.github/.github/workflows/argos.yml@main
#       secrets:
#         claude-token: ...    # como acima
#       with:
#         environment: argos
# O caller não passa nada sob o nome ARGOS_APP_PRIVATE_KEY. O job `review` passa a rodar nesse environment e (#50)
# lê dele o secret ARGOS_APP_PRIVATE_KEY. Um secret de (#50)
# environment só chega ao job que declara o `environment`, e o caller não pode usar essa palavra num job que (#50)
# chama um reusable, por isso o environment é um input. O nome de um secret do GitHub (de environment, de repo (#50)
# ou de org) só tem letras, números e sublinhado, sem hífen, por isso este leva outro nome que o (#50)
# `argos-app-private-key`; o caller declara o secret pelo nome, como manda a doc dos reusables. Com o input (#50)
# `environment`, só o secret ARGOS_APP_PRIVATE_KEY é lido, e só do environment que o job declara (o caller não (#50)
# deve passar esse nome: um caller não declara `environment`, então o valor viria do secret de repo ou de org), e (#50)
# o `argos-app-private-key` é ignorado; um secret do environment vazio não cai na chave do caller. Ressalva: se (#50)
# o secret do environment não chegar ao reusable sem um repasse do caller (a verificar no caller do Backstage, (#50)
# barte-ai-services/backstage#489), o repositório não pode ver nenhum secret de repo ou de org chamado
# ARGOS_APP_PRIVATE_KEY, ou a garantia de «sem fallback» não vale. Sem o input, só o `argos-app-private-key` (#50)
# é lido, o job não declara environment e roda como sempre. (#50)
# A chave entra só nos dois passos create-github-app-token (e no booleano HAS_APP_KEY), em nenhum outro (#50)
# passo nem no contêiner do Argos. (#50)
#
# Por que o guarda de fork importa aqui: sob pull_request_target, o workflow roda no contexto da base e (#50)
# recebe os secrets, mesmo para um PR de fork. Sem o guarda `head.repo.full_name == github.repository`, o PR (#50)
# de um fork rodaria com a chave do app. Com ele, o job é pulado. Sob pull_request_target, `github.sha` é o (#50)
# commit da base, e não o do PR: o job faz o checkout de `github.event.pull_request.head.sha` com (#50)
# persist-credentials: false. (#50)
#
# What the PR's head reaches, and what it does not (barte-ai-services/.github#50, #51). The head belongs to
# whoever opened the PR, and the Claude Code in the container is opened at its root, so it would read the (#50)
# head's own project configuration (.claude/settings.json and settings.local.json, .mcp.json, CLAUDE.local.md) (#50)
# and follow it: its `env` block (an LD_PRELOAD there loads into every child process of the container, which (#50)
# reaches the tokens in the environment of process 1), its hooks, its MCP servers, its permission rules. These (#50)
# layers close that: (#50)
#   - the head's `.claude/`, `.mcp.json` and `CLAUDE.local.md` never reach the container. The runner removes (#50)
#     them from the copy it mounts and marks the tracked ones skip-worktree, so `git status` of the copy stays (#50)
#     clean and the Erodos, which commits with `git add --all`, does not commit their removal. The host runs git (#50)
#     on the copy only before the container starts, never after; (#50)
#   - a managed-settings.json that the runner writes and the container mounts read-only at (#50)
#     /etc/claude-code/managed-settings.json, which wins over any project file, stays as defence in depth: (#50)
#     hooks, project MCP servers, marketplace plugins, shell inside skills and the credential helpers of the (#50)
#     project settings are off; ANTHROPIC_BASE_URL is fixed; the model may not Read /proc, /sys or the managed (#50)
#     file, and Bash, WebFetch and WebSearch are denied (the runtime grants none of them: no Bash rule exists (#50)
#     while ARGOS_EXEC_COMMANDS is unset, which this reusable never sets). (#50)
#   - every tracked symlink of the head is removed from the copy too (mode 120000, at any depth, with the same (#50)
#     skip-worktree). Probed on Claude Code 2.1.296 with a mock model: a committed CLAUDE.md that is a symlink to (#50)
#     /proc/1/environ is loaded as project memory, and a committed lib/x that is one is read by Read and by Grep (#50)
#     of its path, so without the managed deny on /proc the whole environment of process 1, the tokens (#50)
#     included, reached the model's request. With the deny, Read, Grep and the memory load were refused, so the (#50)
#     removal is defence in depth, not the only closure. A fresh checkout has no untracked symlink, so the (#50)
#     tracked ones are all there are; (#50)
#   - Claude Code also loads a CLAUDE.local.md and a .claude/ from a subdirectory, so the same removal, with the (#50)
#     same skip-worktree, takes them at any depth; (#50)
#   - the Erodos holds Edit and Write, so the managed file also denies them on /repo/.claude, /repo/.mcp.json, (#50)
#     /repo/CLAUDE.local.md, the same two at any depth under /repo, /root and /etc: it cannot create Claude Code (#50)
#     configuration for the run. It also denies them on /repo/.git: the runtime later runs git there (reset, (#50)
#     clean, status) with every token in its environment, and a `[filter]` smudge command or `core.fsmonitor` (#50)
#     the model wrote into .git/config would run then and leak them. The runtime's own git commands are not the (#50)
#     model's Edit or Write, so the deny does not touch them. A nested .git is denied too, a directory or a (#50)
#     gitfile (`x/.git/**` and `y/.git`): written with plain files, it makes `git add --all` record a gitlink, (#50)
#     and the next `git status` in /repo runs that nested repository's config, its core.fsmonitor, with the (#50)
#     tokens (safe.directory does not refuse it). As defence in depth the docker run also sets (#50)
#     diff.ignoreSubmodules=all through the git env config, so status and diff do not open a gitlink at all; (#50)
#     the runtime appends its own auth header after the entries it finds there (GIT_CONFIG_COUNT), so the (#50)
#     push is not affected; (#50)
#   - what the container can write (#50): the root filesystem is read-only (docker run --read-only), so the
#     Erodos cannot overwrite /usr/bin/git, which later runs with every token the container holds, or anything (#50)
#     else of the image. Writable are /repo (the copy, the one read-write bind) and the tmpfs /tmp, /root and (#50)
#     Docker's /dev/shm, all mounted noexec and gone with the container; the event file and the managed file (#50)
#     are mounted read-only. The managed file also denies Edit and Write on /usr, /app, /bin, /sbin, /lib, (#50)
#     /opt and /var, as defence in depth behind the read-only root. (#50)
# Out on purpose: allowManagedPermissionRulesOnly, which would drop the Edit and Write grants the Erodos runs (#50)
# with. The trade-off: the model no longer reads the head's own `.claude/` files, so a PR that changes them is (#50)
# reviewed from the diff alone. CLAUDE.md stays in the copy, and Claude Code loads a regular one as (#50)
# project instructions, not as data: the head can still instruct the model. That is bounded by the model having no (#50)
# Bash, WebFetch or WebSearch, the managed denies, the validation of what it returns, and the leak check below. (#50)
# An @-import in CLAUDE.md of /proc/self/environ or /proc/1/environ was not expanded in the probe (the file text (#50)
# loaded, the target did not); an import of a file inside the repository is expanded, and that file is the (#50)
# head's own data. The root fix is in (#50)
# ahrena-agents: settingSources without `project`. That issue is still to be opened in ahrenatechnology/ahrena-agents. (#50)
# The container works on a copy of the checkout (cp -a in $RUNNER_TEMP), not on the runner's workspace: what (#50)
# the head writes there, the .git included, does not reach the workspace, and no later step reads a file from (#50)
# it; the next steps read only $RUNNER_TEMP/review.json, which the container hands over on stdout. The Argos (#50)
# reads the copy and, with fix on, the Erodos also commits and pushes from it, with its own write token (the (#50)
# URL and the auth header go in the runtime's git environment, not in .git/config). What the model writes is (#50)
# data, not code: no `run:` receives it through ${{ }}, each value (verdict, blocking, decision, fixed) is (#50)
# validated before it goes to GITHUB_OUTPUT, and a review that carries the value of any token of the job is (#50)
# not posted: the PR is held and the comment says so. That leak check reads review.json only: the Erodos commit (#50)
# and push happen inside the container and are not checked, and a token split across values or in another (#50)
# encoded form (base64, hex) is missed; one spelled with JSON escapes is caught (#50).

on:
  workflow_call:
    inputs:
      mode:
        description: "comment (só comenta, check verde) ou block (achado blocking deixa o check vermelho)"
        type: string
        default: comment
      model:
        description: "Modelo do Argos. Vazio: o default da plataforma, no ahrena-agents."
        type: string
        default: ""
      auto-merge:
        description: "Liga o auto-merge do PR quando o Argos aprova com 0 bloqueantes."
        type: boolean
        default: true
      fix:
        description: "O Erodos faz uma rodada de autofix dos warnings de um approve, e corrige o mecânico de um PR segurado."
        type: boolean
        default: true
      max-rounds:
        description: "Rodadas do Erodos num PR segurado (bloqueante, checagem vermelha). Vazio: o default do ahrena-agents (2)."
        type: string
        default: ""
      environment:
        description: "O environment em que o job roda e de que lê o secret ARGOS_APP_PRIVATE_KEY. Vazio: o job não declara environment."
        type: string
        default: ""
    secrets:
      claude-token:
        description: "O token do Claude Code (claude setup-token) com que o Argos roda."
        required: true
      argos-app-private-key:
        description: "A chave do app argos-by-ahrena. Sem ela, o parecer sai como github-actions[bot]."
        required: false
      ARGOS_APP_PRIVATE_KEY:
        description: "A mesma chave, pelo nome que um secret de environment pode ter. Lida só do environment que o job declara, com o input environment preenchido, e então é a única chave lida; o caller não deve passar esse nome (passar viraria um secret de repo ou de org, fora do environment). Sem o input, vale só o argos-app-private-key."
        required: false
      cloudflare-api-token:
        description: "O token da Cloudflare, com escopo Workers AI, com que o Decisor pergunta ao Clef."
        required: false

# Sem permissions aqui: o job herda as do caller. Um caller que dá issues: write abre os follow-ups com o
# github.token; um reusable que pedisse issues: write derrubaria todo caller que não a dá. Por isso o caller
# tem de declarar um bloco permissions explícito, com contents: read, pull-requests: write e, se quiser os
# follow-ups, issues: write, como o template: sem ele, o job herdaria o token padrão do repositório, que vai
# para o contêiner do Argos como GH_TOKEN.

jobs:
  review:
    name: argos
    # Rascunho ainda não está pronto para ler, o Dependabot já tem o próprio check, e um PR de fork não recebe
    # os secrets (e o Argos nunca lê o checkout de um fork com credencial). Sob pull_request_target o fork (#50)
    # receberia os secrets, por isso o guarda de fork é o que segura esse modo. (#50)
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    # Vazio, o input vira null e o job não declara environment. A doc não diz o que um environment vazio faz; (#50)
    # null é o valor de uma expressão que deixa o campo sem valor. (#50)
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push supersedes the review of the previous one, except the Erodos's own push: it lands while the
    # run that made it still posts the opinion, so the new review waits for it instead of cancelling it.
    concurrency:
      group: argos-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event.sender.login != 'argos-by-ahrena[bot]' }}
    env:
      # ahrenatechnology/ahrena-agents v1.4.1, pelo digest: uma tag no registry pode ser movida.
      ARGOS_IMAGE: ghcr.io/ahrenatechnology/ahrena-agents@sha256:06c59d9cb50eb6742a7178e2bbd73df0e648cbdeff64e927afbef92852aece7c
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      HAS_APP_KEY: ${{ (inputs.environment != '' && secrets.ARGOS_APP_PRIVATE_KEY || inputs.environment == '' && secrets.argos-app-private-key || '') != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: o token do Argos (app argos-by-ahrena), quando a org o tem
        id: app
        if: vars.ARGOS_APP_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARGOS_APP_ID }}
          private-key: ${{ inputs.environment != '' && secrets.ARGOS_APP_PRIVATE_KEY || inputs.environment == '' && secrets.argos-app-private-key || '' }}

      # The Erodos's push gets a token of its own: contents: write on this repository only. The app's
      # full token (pull requests, the hold, the opinion) never enters the container where the model reads
      # the PR.
      - name: o token do push do Erodos, só com escrita no conteúdo deste repositório
        id: push
        if: steps.app.outputs.token != '' && inputs.fix
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARGOS_APP_ID }}
          private-key: ${{ inputs.environment != '' && secrets.ARGOS_APP_PRIVATE_KEY || inputs.environment == '' && secrets.argos-app-private-key || '' }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A head that differs from the last reviewed head only by merges of the base (auto-merge.yml updates the
      # branch of a PR behind main) inherits the opinion: a new review would only swap one opinion for another on
      # the same code. "Only merges of the base" is checked commit by commit, from the head down the first
      # parents to the reviewed commit: each is a merge whose second parent is in the base, and whose tree is the
      # one `git merge-tree` writes for its parents, so no hand-made resolution rides along. On top, the PR's
      # diff against the base keeps its patch-id (`git diff --binary`, --verbatim: line numbers do not count,
      # whitespace does, a binary counts by its content), so a base change next to the PR's lines is reviewed.
      # The opinion is read only from the app's comment, edited by no one but the app: write access edits any
      # comment, and github-actions[bot] is any workflow of the repo. When inherited, the Argos step copies the
      # opinion, and the comment, argos:hold and auto-merge stay as they are: an earlier hold stays, and so does
      # an admin's lift after the opinion. The new head's checks are not read again: the ruleset's required
      # checks hold the merge. Any doubt (no app, no opinion, an edited comment, a reviewed commit the checkout
      # lacks, a header it cannot read, a failure of this step) is a new review.
      - name: o parecer herdado, quando o head só mescla a base
        id: inherit
        if: steps.app.outputs.app-slug != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ format('{0}[bot]', steps.app.outputs.app-slug) }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            | jq -c '[add[] | select(.user.login == env.AUTHOR and (.body | startswith("<!-- ahrena-review -->")))] | last // empty')"
          comment="$(jq -r '.body // empty' <<<"${found:-null}")"
          node="$(jq -r '.node_id // empty' <<<"${found:-null}")"
          # Every edit, by the comment's author: the app edits it on every review.
          edited_by_others=true
          if [ -n "$node" ]; then
            edited_by_others="$(gh api graphql --paginate --slurp -f id="$node" -f query='
              query($id: ID!, $endCursor: String) { node(id: $id) { ... on IssueComment {
                author { login }
                userContentEdits(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor } nodes { editor { login } } } } } }' \
              | jq '[.[].data.node] | if any(. == null) then true
                  else [.[] as $n | $n.userContentEdits.nodes[] | .editor.login != $n.author.login] | any end')"
          fi
          reviewed="$(grep -oE '^<sub>commit [0-9a-f]{40} · ' <<<"$comment" | tail -n1 | cut -d' ' -f2 || true)"
          header="$(grep -m1 -E '^\*\*Verdict:\*\*' <<<"$comment" || true)"
          verdict="$(sed -nE 's/^\*\*Verdict:\*\* *`([a-z_]+)`.*/\1/p' <<<"$header")"
          decision="$(sed -nE 's/.*\*\*Decisor:\*\* *`([^`]+)`.*/\1/p' <<<"$header")"
          blocking="$(grep -m1 -oE '\*\*[0-9]+\*\* bloqueantes' <<<"$comment" | tr -dc '0-9' || true)"
          # The comment is the app's, but it is text a person may have touched, and it travels as an output: each (#50)
          # field is checked before it is written. A verdict that is none of the three is a comment, which holds (#50)
          # the PR; a decision is one short line with no control character and no backtick; a commit that is not (#50)
          # 40 hex digits, or a count that is not digits, is a doubt, and a doubt is a new review. (#50)
          if [ -n "$verdict" ]; then
            case "$verdict" in approve|request_changes|comment) ;; *) verdict=comment ;; esac
          fi
          decision="$(printf '%s' "$decision" | tr -d '\000-\037\177`' | cut -c1-200)"
          [[ "$blocking" =~ ^[0-9]+$ ]] || blocking=""
          [[ "$reviewed" =~ ^[0-9a-f]{40}$ ]] || reviewed=""
          # From the head down the first parents to the reviewed commit, only clean merges of the base.
          merges_only() {
            local commit="$HEAD" parents tree
            for _ in $(seq 20); do
              [ "$commit" = "$reviewed" ] && return 0
              read -r -a parents <<<"$(git rev-list --parents -n1 "$commit")"
              [ "${#parents[@]}" -eq 3 ] || return 1
              git merge-base --is-ancestor "${parents[2]}" "$BASE" || return 1
              tree="$(git merge-tree --write-tree "${parents[1]}" "${parents[2]}")" || return 1
              [ "$tree" = "$(git rev-parse "$commit^{tree}")" ] || return 1
              commit="${parents[1]}"
            done
            return 1
          }
          patch() { git diff --binary --no-color --no-ext-diff "$BASE...$1" | git patch-id --verbatim | cut -d' ' -f1; }
          inherited=false
          if [ "$edited_by_others" = false ] && [ -n "$reviewed" ] && [ "$reviewed" != "$HEAD" ] \
            && [ -n "$verdict" ] && [ -n "$decision" ] && [ -n "$blocking" ] \
            && git cat-file -e "$reviewed^{commit}" 2>/dev/null && merges_only; then
            before="$(patch "$reviewed")"
            if [ -n "$before" ] && [ "$before" = "$(patch "$HEAD")" ]; then
              inherited=true
            fi
          fi
          {
            echo "inherited=$inherited"
            if [ "$inherited" = true ]; then
              echo "reviewed=$reviewed"
              echo "verdict=$verdict"
              echo "decision=$decision"
              echo "blocking=$blocking"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: o Argos lê o PR
        id: argos
        env:
          INHERITED: ${{ steps.inherit.outputs.inherited }}
          INHERITED_VERDICT: ${{ steps.inherit.outputs.verdict }}
          INHERITED_DECISION: ${{ steps.inherit.outputs.decision }}
          INHERITED_BLOCKING: ${{ steps.inherit.outputs.blocking }}
          CLAUDE_KEY: ${{ secrets.claude-token }}
          ARGOS_MODEL: ${{ inputs.model }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          # The Erodos pushes only with the app's token: a push by the github.token would not start the new review.
          ARGOS_FIX: ${{ inputs.fix && steps.push.outputs.token != '' }}
          ARGOS_MAX_ROUNDS: ${{ inputs.max-rounds }}
          ARGOS_PUSH_TOKEN: ${{ steps.push.outputs.token }}
          # Not passed to the container: only the leak check below reads it. (#50)
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # What the model wrote, or what an earlier step read from a comment, is data: it reaches GITHUB_OUTPUT (#50)
          # only through these checks, and no later step interpolates it into a script. A verdict that is none (#50)
          # of the three is a comment, which holds the PR. A decision is one short line, with no control (#50)
          # character (CR and LF included) and no backtick. A blocking count that is not digits is `unknown`, (#50)
          # which is not 0, so the PR is held and the check names the doubt. (#50)
          safe_verdict() { case "$1" in approve|request_changes|comment) printf '%s' "$1" ;; *) printf comment ;; esac; }
          safe_count() { if [[ "$1" =~ ^[0-9]+$ ]]; then printf '%s' "$1"; else printf unknown; fi; }
          safe_line() { printf '%s' "$1" | tr -d '\000-\037\177`' | cut -c1-200; }
          write_outputs() {
            { echo "verdict=$(safe_verdict "$1")"; echo "blocking=$(safe_count "$2")"
              echo "decision=$(safe_line "$3")"; [ $# -lt 4 ] || echo "fixed=$4"; } >> "$GITHUB_OUTPUT"
          }
          # The inherited opinion stands in for the review, so the steps below read one set of outputs.
          if [ "$INHERITED" = true ]; then
            write_outputs "$INHERITED_VERDICT" "$INHERITED_BLOCKING" "$INHERITED_DECISION"
            exit 0
          fi
          if [ -z "$CLAUDE_KEY" ]; then
            echo "::error::sem token do Claude: o caller não passou claude-token, ou o secret de org não alcança este repo"
            exit 1
          fi
          # The secret holds either kind of key, and the Argos reads each from its own variable: an API key of the
          # Console (sk-ant-api…) is ANTHROPIC_API_KEY, the token of `claude setup-token` (sk-ant-oat…) is
          # CLAUDE_CODE_OAUTH_TOKEN. Swapping the key is then only `gh secret set`, whichever it is.
          case "$CLAUDE_KEY" in
            sk-ant-api*) export ANTHROPIC_API_KEY="$CLAUDE_KEY" ;;
            *) export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_KEY" ;;
          esac
          # The head's own Claude Code configuration does not bind the container (#50). It is kept out of the
          # copy below, and the runner also writes managed settings, which win over the project's, as defence in (#50)
          # depth: the container mounts them read-only where Claude Code reads them on Linux (2.1.296, the one in (#50)
          # the pinned image). Each key was run against a head whose .claude/settings.json and .mcp.json try the (#50)
          # thing it closes. Not here on purpose: allowManagedPermissionRulesOnly would drop the Edit and Write (#50)
          # grants the Erodos runs with. The deny rules win over any allow; the runtime grants no Bash (no (#50)
          # ARGOS_EXEC_COMMANDS is set), no WebFetch and no WebSearch, so denying them cuts nothing. An empty (#50)
          # string overrides the head's helper and leaves the key as unset, so the login by (#50)
          # CLAUDE_CODE_OAUTH_TOKEN goes on. (#50)
          managed="$RUNNER_TEMP/managed-settings.json"
          cat > "$managed" <<'MANAGED'
          {
            "disableAllHooks": true,
            "allowManagedHooksOnly": true,
            "enableAllProjectMcpServers": false,
            "allowManagedMcpServersOnly": true,
            "allowedMcpServers": [],
            "strictKnownMarketplaces": [],
            "disableSkillShellExecution": true,
            "apiKeyHelper": "",
            "awsAuthRefresh": "",
            "awsCredentialExport": "",
            "gcpAuthRefresh": "",
            "otelHeadersHelper": "",
            "proxyAuthHelper": "",
            "permissions": {
              "deny": [
                "Read(//proc/**)", "Read(//sys/**)", "Read(//etc/claude-code/**)", "Bash", "WebFetch", "WebSearch",
                "Edit(//repo/.claude/**)", "Edit(//repo/.mcp.json)", "Edit(//repo/CLAUDE.local.md)",
                "Edit(//repo/**/.claude/**)", "Edit(//repo/**/CLAUDE.local.md)", "Edit(//repo/.git/**)",
                "Edit(//repo/**/.git)", "Edit(//repo/**/.git/**)",
                "Edit(//root/**)", "Edit(//etc/**)",
                "Edit(//usr/**)", "Edit(//app/**)", "Edit(//bin/**)", "Edit(//sbin/**)", "Edit(//lib/**)",
                "Edit(//opt/**)", "Edit(//var/**)",
                "Write(//repo/.claude/**)", "Write(//repo/.mcp.json)", "Write(//repo/CLAUDE.local.md)",
                "Write(//repo/**/.claude/**)", "Write(//repo/**/CLAUDE.local.md)", "Write(//repo/.git/**)",
                "Write(//repo/**/.git)", "Write(//repo/**/.git/**)",
                "Write(//root/**)", "Write(//etc/**)",
                "Write(//usr/**)", "Write(//app/**)", "Write(//bin/**)", "Write(//sbin/**)", "Write(//lib/**)",
                "Write(//opt/**)", "Write(//var/**)"
              ],
              "disableBypassPermissionsMode": "disable"
            },
            "env": { "ANTHROPIC_BASE_URL": "https://api.anthropic.com" }
          }
          MANAGED
          # The container works on a copy of the checkout. What the head writes there, the .git included, does not (#50)
          # reach the workspace. The copy sits next to, and not under, the files the later steps read (#50)
          # ($RUNNER_TEMP/review.json comes out on stdout). The head's Claude Code project configuration is (#50)
          # dropped from the copy (#50): skip-worktree on the tracked paths first, so `git status` stays clean
          # and the Erodos's `git add --all` does not stage their deletion, then the files go. This is the only (#50)
          # git the host runs on the copy, and it runs before the container: after it, none. (#50)
          repo_copy="$(mktemp -d "$RUNNER_TEMP/argos-repo.XXXXXX")"
          cp -a "$PWD/." "$repo_copy/"
          # Claude Code also loads a CLAUDE.local.md and a .claude/ from a subdirectory, so those go at any depth (#50)
          # (the `.mcp.json` is read from the root only). The tracked ones by pathspec, the rest by find, which (#50)
          # does not follow a symlink. (#50)
          git -C "$repo_copy" ls-files -z -- ':(glob)**/.claude' ':(glob)**/.claude/**' ':(glob)**/CLAUDE.local.md' .mcp.json \
            | xargs -0 -r git -C "$repo_copy" update-index --skip-worktree --
          rm -rf "$repo_copy/.mcp.json"
          find "$repo_copy" -name .git -prune -o \( -name .claude -o -name CLAUDE.local.md \) -prune -exec rm -rf {} +
          # #50: the same for every tracked symlink (mode 120000, any depth): cp -a keeps them, and one that
          # points into /proc is read as a file or loaded as CLAUDE.md. Unlinked with rm, never followed. (#50)
          links="$(mktemp "$RUNNER_TEMP/argos-links.XXXXXX")"
          git -C "$repo_copy" ls-files -s -z | while IFS= read -r -d '' entry; do
            if [ "${entry%% *}" = 120000 ]; then printf '%s\0' "${entry#*$'\t'}"; fi
          done > "$links"
          git -C "$repo_copy" update-index --skip-worktree -z --stdin < "$links"
          (cd "$repo_copy" && xargs -0 -r rm -f -- < "$links")
          rm -f "$links"
          # O checkout é do runner e o contêiner roda como root: sem o safe.directory, o git do contêiner
          # recusa o repositório («dubious ownership») e o roteamento não acha o diff.
          set +e
          # The event goes in read-only: the runtime reads from it whether the head is of this repository and
          # its branch, which is where the Erodos pushes. The Erodos pushes from the copy: it names the remote (#50)
          # by URL and sends the credential in the git environment, so it needs nothing from the copy's config. (#50)
          # The root filesystem is read-only (#50): the Erodos holds Edit and Write, and an overwritten
          # /usr/bin/git would later run with every token the container holds. Writable are /repo (the copy, (#50)
          # the only read-write bind), and the tmpfs /tmp, /root and Docker's /dev/shm (all noexec), which the (#50)
          # runtime uses and which go away with the container. /repo/.git and any nested .git are denied to the model (#50)
          # by the managed file: git runs in /repo later with the tokens, so a config the model wrote there would (#50)
          # run, and diff.ignoreSubmodules=all (second entry of the env config, after safe.directory) keeps status (#50)
          # and diff from opening a gitlink the model recorded. (#50)
          docker run --rm --read-only --tmpfs /tmp --tmpfs /root \
            -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY -e ARGOS_MODEL -e GH_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_API_TOKEN \
            -e ARGOS_FIX -e ARGOS_MAX_ROUNDS -e ARGOS_PUSH_TOKEN \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_API_URL -e GITHUB_SERVER_URL \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" -e GITHUB_EVENT_PATH=/github/event.json \
            -v "$managed:/etc/claude-code/managed-settings.json:ro" \
            -e GIT_CONFIG_COUNT=2 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -e GIT_CONFIG_KEY_1=diff.ignoreSubmodules -e GIT_CONFIG_VALUE_1=all \
            -v "$repo_copy:/repo" -w /repo \
            "$ARGOS_IMAGE" --pr "$PR" --changed "$BASE...$HEAD" \
            > "$RUNNER_TEMP/review.json" 2> "$RUNNER_TEMP/review.log"
          status=$?
          set -e
          # Files the container made are root's: the runner's own user may not be able to remove them. (#50)
          rm -rf "${repo_copy:?}" 2>/dev/null || sudo -n rm -rf "${repo_copy:?}" 2>/dev/null || true
          cat "$RUNNER_TEMP/review.log" >&2
          if [ "$status" -ne 0 ] || ! jq -e . "$RUNNER_TEMP/review.json" >/dev/null 2>&1; then
            echo "::error::o Argos não terminou a review (saída $status); o log está acima"
            exit 1
          fi
          # A review that carries the literal value of a token the job holds is not posted (#50): a model under
          # injection could read the job's environment and write it into the comment. The values come in by env (#50)
          # and are compared by the shell, never put in an argument or an echo (#50). The comment is posted
          # decoded, so each token is compared with the raw text of review.json and with every decoded string (#50)
          # value in it (#50): a token spelled with JSON escapes (\uXXXX, \/) is caught too. The review is
          # replaced by a fixed body, and the PR is held (#50). This reads review.json only: the Erodos commit
          # and push happen inside the container and are not checked here, and a token split across values or (#50)
          # written in another encoding (base64, hex) is not caught (#50).
          leaked=false
          review_text="$(cat "$RUNNER_TEMP/review.json")"
          review_strings="$(jq -r '.. | strings' "$RUNNER_TEMP/review.json")"
          for secret in "$CLAUDE_KEY" "$GH_TOKEN" "$ARGOS_PUSH_TOKEN" "$APP_TOKEN" "$CLOUDFLARE_API_TOKEN"; do
            if [ -n "$secret" ] && { [[ "$review_text" == *"$secret"* ]] || [[ "$review_strings" == *"$secret"* ]]; }; then leaked=true; fi
          done
          if [ "$leaked" = true ]; then
            echo "::error::a saída do modelo trazia o valor de um token do job: o parecer não foi publicado e o PR fica segurado"
            jq -n '{verdict: "comment", findings: [], comment: "<!-- ahrena-review -->\n**Argos** · verdict `comment`\n\nO parecer não foi publicado: a saída do modelo trazia o valor de um segredo do job. O PR fica segurado até uma pessoa ler o log do job."}' \
              > "$RUNNER_TEMP/review.json"
            write_outputs comment unknown "hold_for_human: a saída do modelo trazia um segredo do job" false
            exit 0
          fi
          # Taken whole, and not cut at the first line: a verdict with a newline in it is not a verdict. (#50)
          verdict=$(jq -r 'if (.verdict | type) == "string" then .verdict else "comment" end' "$RUNNER_TEMP/review.json")
          blocking=$(jq '[.findings[]? | select(.severity == "blocking")] | length' "$RUNNER_TEMP/review.json")
          decision=$(jq -r '.decision // "hold_for_human: sem decisor"' "$RUNNER_TEMP/review.json" | head -n1)
          # The Erodos pushed a commit: the review of that commit decides, not this one.
          fixed=$(jq -r 'if .fixCommit then "true" else "false" end' "$RUNNER_TEMP/review.json")
          [ "$fixed" = true ] || fixed=false
          write_outputs "$verdict" "$blocking" "$decision" "$fixed"

      # Approve with 0 blockers releases the merge, and every warning left becomes a follow-up issue in the PR's
      # repository, linked to the PR by its body. One issue per warning: a warning that already has an issue for
      # this PR (the marker in the body, by the same file and title) is not opened again on a later review. The
      # app's token first; while the app has no Issues: write, the github.token, when the caller gives
      # issues: write. When neither can open it, the warning stays listed in the opinion, and the merge goes on.
      - name: os follow-ups, quando o Argos aprova com warnings
        id: followups
        if: >-
          steps.inherit.outputs.inherited != 'true'
          && steps.argos.outputs.verdict == 'approve'
          && steps.argos.outputs.blocking == '0'
          && steps.argos.outputs.fixed != 'true'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/followups.md"
          : > "$out"
          jq -c '.findings[]? | select(.severity == "warning")' "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/warnings.jsonl"
          [ -s "$RUNNER_TEMP/warnings.jsonl" ] || exit 0
          # One call with the app's token first, then the job's. The output is kept only from the call that
          # succeeded: a failed `gh api` writes its error body to stdout, and that is never an answer.
          as_any() {
            local token answer
            for token in "$APP_TOKEN" "$JOB_TOKEN"; do
              [ -n "$token" ] || continue
              if answer="$(GH_TOKEN="$token" "$@" 2>/dev/null)"; then
                used="$token"
                printf '%s' "$answer"
                return 0
              fi
            done
            return 1
          }
          # Model text goes into an issue and a comment: one line, and no @mention that notifies anyone.
          plain() { tr '\r\n' '  ' | sed -e 's/@/@\xe2\x80\x8b/g' -e 's/ *$//'; }
          # The PR's labels, without the ones that belong to the PR itself (size, status, the hold).
          used=""
          labels="$(as_any gh pr view "$PR" -R "$REPO" --json labels \
            --jq '[.labels[].name | select(test("^(size/|status: |argos:)") | not)] | join(",")' || true)"
          # Every issue of this repository that names this PR in a follow-up marker, opened or closed, read
          # with every token: a token without Issues read lists pull requests only, and finds nothing.
          # Only issues touched since the PR was opened: a follow-up of this PR is never older than it.
          : > "$RUNNER_TEMP/existing.tsv"
          for token in "$APP_TOKEN" "$JOB_TOKEN"; do
            [ -n "$token" ] || continue
            GH_TOKEN="$token" gh api --paginate "repos/$REPO/issues?state=all&per_page=100&since=$PR_CREATED" \
              --jq ".[] | select(.pull_request == null) | select(.body // \"\" | contains(\"<!-- argos-follow-up pr=$PR \")) | [.number, ((.body | capture(\"key=(?<k>[0-9a-f]{12})\") | .k) // \"\")] | @tsv" \
              > "$RUNNER_TEMP/lookup.tsv" 2>/dev/null || continue
            # Only number<TAB>key lines: a failed call left its error body here, never a row.
            grep -E "^[0-9]+$(printf '\t')" "$RUNNER_TEMP/lookup.tsv" >> "$RUNNER_TEMP/existing.tsv" || true
          done
          echo "### Follow-ups" >> "$out"
          echo >> "$out"
          while IFS= read -r w; do
            title="$(jq -r '.title' <<<"$w" | plain)"
            file="$(jq -r '.file // ""' <<<"$w" | plain)"
            line="$(jq -r '.line // ""' <<<"$w")"
            where="${file:+\`$file${line:+:$line}\`}"
            key="$(printf '%s\n%s' "$file" "$title" | sha256sum | cut -c1-12)"
            known="$(awk -F'\t' -v k="$key" '$2 == k {print $1; exit}' "$RUNNER_TEMP/existing.tsv")"
            if [ -n "$known" ]; then
              echo "- #$known · $title ${where}" >> "$out"
              continue
            fi
            body="$RUNNER_TEMP/followup-$key.md"
            {
              echo "<!-- argos-follow-up pr=$PR key=$key -->"
              echo "Follow-up de #$PR ($PR_URL): um warning que o Argos levantou no parecer do commit $HEAD, que aprovou o PR com 0 bloqueantes. O PR entrou, e este achado fica para cá."
              echo
              echo "**Achado:** $title"
              [ -n "$where" ] && echo "**Onde:** $where"
              echo "**Tipo:** $(jq -r '.kind // "—"' <<<"$w" | plain) · **Regra:** $(jq -r '.rule // "—"' <<<"$w" | plain)"
              echo
              echo "Aberto pelo Argos, a partir do parecer publicado no PR."
            } > "$body"
            # Not in a subshell: `used` keeps the token that opened the issue, for the labels and the type.
            used=""
            as_any gh api "repos/$REPO/issues" -f title="Follow-up de #$PR: ${title:0:180}" \
              -F body=@"$body" --jq .number > "$RUNNER_TEMP/number" || : > "$RUNNER_TEMP/number"
            number="$(cat "$RUNNER_TEMP/number")"
            if ! [[ "$number" =~ ^[0-9]+$ ]]; then
              echo "- não aberto (sem permissão para abrir issue) · $title ${where}" >> "$out"
              continue
            fi
            # Labels and the issue type are best effort: the issue already exists and is linked.
            if [ -n "$labels" ]; then
              GH_TOKEN="$used" gh issue edit "$number" -R "$REPO" --add-label "$labels" >/dev/null 2>&1 || true
            fi
            GH_TOKEN="$used" gh api -X PATCH "repos/$REPO/issues/$number" -f type=Task >/dev/null 2>&1 || true
            echo "- #$number · $title ${where}" >> "$out"
          done < "$RUNNER_TEMP/warnings.jsonl"
          echo "list=$out" >> "$GITHUB_OUTPUT"

      # Um comentário só por PR, editado a cada push: o marcador <!-- ahrena-review --> do runtime o acha.
      # An inherited opinion leaves the comment as it is: its time is what an admin's lift is read against.
      - name: o parecer, no PR
        if: steps.inherit.outputs.inherited != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          # Quem publica edita só o comentário que é seu: editar um comentário não muda o autor, e o parecer
          # tem de sair com a cara de quem o escreveu.
          AUTHOR: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          FOLLOWUPS: ${{ steps.followups.outputs.list }}
          VERDICT: ${{ steps.argos.outputs.verdict }}
          MODE: ${{ inputs.mode }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          jq -r '.comment // empty' "$RUNNER_TEMP/review.json" > "$body"
          if [ ! -s "$body" ]; then
            { echo "<!-- ahrena-review -->"; echo "**Argos** · verdict \`$VERDICT\`"; echo
              jq -r '.summary // "(sem parecer)"' "$RUNNER_TEMP/review.json"; } > "$body"
          fi
          if [ -n "$FOLLOWUPS" ] && [ -s "$FOLLOWUPS" ]; then
            { echo; cat "$FOLLOWUPS"; } >> "$body"
          fi
          printf '\n<sub>commit %s · modo %s</sub>\n' "$HEAD" "$MODE" >> "$body"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == env.AUTHOR and (.body | startswith("<!-- ahrena-review -->")))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" >/dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file "$body"
          fi

      # O Argos é quem decide o merge, pelo parecer, e não o Decisor. approve com 0 bloqueantes libera: o label
      # sai. Qualquer outro parecer (um bloqueante, request_changes, comment, uma checagem vermelha, o Argos que
      # não rodou) segura: o PR ganha o label argos:hold e o auto-merge sai, se alguém o tinha ligado. O
      # auto-merge.yml da org não liga o auto-merge num PR com esse label. Quando o Erodos empurrou um commit
      # num approve, a revisão desse commit decide, e o label fica como está. Este passo roda antes de o job
      # terminar, e o check do Argos só fica verde no fim: o GitHub não tem como mesclar entre os dois.
      - name: o argos:hold, quando o Argos não libera o merge
        # An inherited opinion leaves the label as it is, held or lifted.
        if: >-
          always()
          && steps.argos.conclusion != 'cancelled'
          && steps.inherit.outputs.inherited != 'true'
        env:
          # O próprio Argos aplica e remove o hold: o token do app, e o do job só onde a org não tem o app.
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ steps.argos.outputs.verdict }}
          BLOCKING: ${{ steps.argos.outputs.blocking }}
          FIXED: ${{ steps.argos.outputs.fixed }}
          DECISION: ${{ steps.argos.outputs.decision }}
        run: |
          label="argos:hold"
          if [ "$VERDICT" = approve ] && [ "$BLOCKING" = 0 ]; then
            if [ "$FIXED" = true ]; then
              echo "o Erodos empurrou um commit: a revisão dele decide" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr edit "$PR" -R "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
            echo "o Argos libera o merge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create "$label" -R "$REPO" --color B60205 \
            --description "O Argos segurou o PR: o auto-merge fica desligado até uma revisão aprovar" >/dev/null 2>&1 || true
          gh pr edit "$PR" -R "$REPO" --add-label "$label" >/dev/null
          if [ "$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "$PR" -R "$REPO" --disable-auto >/dev/null
            echo "auto-merge desligado" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "o Argos segura o PR (verdict \`${VERDICT:-?}\`, ${BLOCKING:-?} bloqueante(s), decisor \`${DECISION:-?}\`): label $label" >> "$GITHUB_STEP_SUMMARY"

      - name: o merge, quando o Argos aprova com 0 bloqueantes
        # An inherited opinion leaves auto-merge as it is, like the hold: the label may be on the PR.
        if: >-
          inputs.auto-merge
          && steps.inherit.outputs.inherited != 'true'
          && steps.argos.outputs.verdict == 'approve'
          && steps.argos.outputs.blocking == '0'
          && steps.argos.outputs.fixed != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::o Argos aprova, mas o app do Argos não deu token: o PR espera um humano"
            exit 0
          fi
          if gh pr merge "$PR" -R "$REPO" --squash --auto --match-head-commit "$HEAD" 2> "$RUNNER_TEMP/merge.err"; then
            echo "auto-merge ligado: o PR entra quando os checks obrigatórios passarem" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::o auto-merge não foi ligado, e o PR espera um humano: $(head -n1 "$RUNNER_TEMP/merge.err")"
          fi

      - name: o resumo
        env:
          INHERITED: ${{ steps.inherit.outputs.inherited }}
          REVIEWED: ${{ steps.inherit.outputs.reviewed }}
          VERDICT: ${{ steps.argos.outputs.verdict }}
          BLOCKING: ${{ steps.argos.outputs.blocking }}
          DECISION: ${{ steps.argos.outputs.decision }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "### Argos"
            echo "verdict \`$VERDICT\` · $BLOCKING blocking · modo \`$MODE\`"
            echo
            echo "Decisor (informação, não segura o merge): \`$DECISION\`"
            if [ "$INHERITED" = true ]; then
              echo
              echo "Parecer herdado de \`$REVIEWED\`: o head só mescla a base, e o diff do PR contra ela é o mesmo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: o check
        if: inputs.mode == 'block' && steps.argos.outputs.blocking != '0'
        env:
          BLOCKING: ${{ steps.argos.outputs.blocking }}
        run: |
          echo "::error::o Argos achou $BLOCKING problema(s) blocking; o parecer está no PR"
          exit 1
