name: argos

# Reusable: o Argos, o revisor da Ahrena (ahrenatechnology/ahrena-agents), lê o PR contra as regras do
# ahrena-framework e publica o parecer no PR. É a primeira coisa que olha um PR na Barte: roda em paralelo
# ao CI e não soma tempo a ele.
#
# O Argos só lê: as ferramentas dele são Read, Grep e Glob, ele não sobe a aplicação, não builda e não roda
# teste.
#
# Desde a v1.3.0, o Argos lê o resultado das outras checagens do commit antes de dar o parecer, e espera
# até 15 min que elas terminem. Uma checagem vermelha vira achado bloqueante e o PR fica para uma pessoa.
# Para ler, o caller dá ao workflow `checks: read` e `statuses: read`. Sem essas permissões, o Argos revisa
# como antes e o comentário diz que o parecer não considera o CI. O reusable não pede as duas permissões:
# um reusable que pede mais do que o caller dá derruba o workflow.
#
# Depois da review, o Decisor pergunta ao Clef (o modelo de decisão do Workers AI, @cf/cloudflare/clef) o
# risco, a chance de regressão e a de o PR poder entrar sem humano, e aplica os limiares: a decisão é
# auto_merge ou hold_for_human, com as probabilidades, e vai no parecer.
#
# Quando o Argos aprova e o Decisor diz auto_merge, o reusable liga o auto-merge (squash) do PR com o token do
# app do Argos: o GitHub faz o merge quando os checks obrigatórios do ruleset passam, e não antes. O token tem
# de ser o do app, e não o github.token: um merge feito pelo github.token não dispara os workflows da main.
# Num repo com o auto-merge desligado (o template), ou sem o app, o passo avisa e o PR espera um
# humano. Para desligar num repo, o caller passa auto-merge: false. O app precisa de Contents: write.
#
# Precisa da variable de org CLOUDFLARE_ACCOUNT_ID e do secret CLOUDFLARE_API_TOKEN (escopo Workers AI).
# Sem eles, ou com o Clef fora, a decisão é hold_for_human, e a review sai do mesmo jeito.
#
# Dois modos:
#   comment  o parecer vai como comentário e o check fica verde. É o modo de calibrar (o default).
#   block    um achado blocking deixa o check vermelho, e o ruleset que exige o check segura o merge.
#
# Identidade: o parecer sai como o app «Argos, by Ahrena» (argos-by-ahrena) quando a org tem a variable
# ARGOS_APP_ID e o secret ARGOS_APP_PRIVATE_KEY, e o app está instalado no repo. Sem eles, sai como
# github-actions[bot], e a review roda do mesmo jeito.
#
# Ativação no repo chamador (.github/workflows/argos.yml), também em workflow-templates/argos.yml:
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:
#     contents: read
#     pull-requests: write
#     checks: read
#     statuses: read
#   jobs:
#     argos:
#       uses: barte-ai-services/.github/.github/workflows/argos.yml@main
#       secrets:
#         claude-token: ${{ secrets.BARTE_ARGOS_CLAUDE_TOKEN || secrets.BARTE_HAROLD_CLAUDE_TOKEN }}
#         argos-app-private-key: ${{ secrets.ARGOS_APP_PRIVATE_KEY }}
#         cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
# Os secrets vão pelo nome, e não por `secrets: inherit`: o reusable recebe só os três que usa. O token do
# Claude é o secret de org BARTE_ARGOS_CLAUDE_TOKEN (claude setup-token), visível aos repos privados;
# enquanto ele não existe, vale o BARTE_HAROLD_CLAUDE_TOKEN.

on:
  workflow_call:
    inputs:
      mode:
        description: "comment (só comenta, check verde) ou block (achado blocking deixa o check vermelho)"
        type: string
        default: comment
      model:
        description: "Modelo do Argos. Vazio: o default da plataforma, no ahrena-agents."
        type: string
        default: ""
      auto-merge:
        description: "Liga o auto-merge do PR quando o Argos aprova e o Decisor diz auto_merge."
        type: boolean
        default: true
      auto-merge-min:
        description: "Decisor: probabilidade mínima de auto_merge (0 a 1). Vazio: o default do ahrena-agents (0.85)."
        type: string
        default: ""
      regression-max:
        description: "Decisor: probabilidade máxima de regressão tolerada (0 a 1). Vazio: o default (0.15)."
        type: string
        default: ""
      max-warnings:
        description: "Decisor: acima de tantos warnings, segura para humano sem perguntar ao Clef. Vazio: o default (2)."
        type: string
        default: ""
    secrets:
      claude-token:
        description: "O token do Claude Code (claude setup-token) com que o Argos roda."
        required: true
      argos-app-private-key:
        description: "A chave do app argos-by-ahrena. Sem ela, o parecer sai como github-actions[bot]."
        required: false
      cloudflare-api-token:
        description: "O token da Cloudflare, com escopo Workers AI, com que o Decisor pergunta ao Clef."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: argos
    # Rascunho ainda não está pronto para ler, o Dependabot já tem o próprio check, e um PR de fork não recebe
    # os secrets (e o Argos nunca lê o checkout de um fork com credencial).
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: argos-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # ahrenatechnology/ahrena-agents v1.3.0, pelo digest: uma tag no registry pode ser movida.
      ARGOS_IMAGE: ghcr.io/ahrenatechnology/ahrena-agents@sha256:850bba6d1023ede86ed6891412b4ed3f0caa7da80807279ad076eec745b30b9c
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      HAS_APP_KEY: ${{ secrets.argos-app-private-key != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: o token do Argos (app argos-by-ahrena), quando a org o tem
        id: app
        if: vars.ARGOS_APP_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARGOS_APP_ID }}
          private-key: ${{ secrets.argos-app-private-key }}

      # A head that differs from the last reviewed head only by merges of the base (auto-merge.yml updates the
      # branch of a PR behind main) inherits the opinion: a new review would only swap one opinion for another on
      # the same code. "Only merges of the base" is checked commit by commit, from the head down the first
      # parents to the reviewed commit: each is a merge whose second parent is in the base, and whose tree is the
      # one `git merge-tree` writes for its parents, so no hand-made resolution rides along. On top, the PR's
      # diff against the base keeps its patch-id (`git diff --binary`, --verbatim: line numbers do not count,
      # whitespace does, a binary counts by its content), so a base change next to the PR's lines is reviewed.
      # The opinion is read only from the app's comment, edited by no one but the app: write access edits any
      # comment, and github-actions[bot] is any workflow of the repo. When inherited, the Argos step copies the
      # opinion, and the comment, argos:hold and auto-merge stay as they are: an earlier hold stays, and so does
      # an admin's lift after the opinion. The new head's checks are not read again: the ruleset's required
      # checks hold the merge. Any doubt (no app, no opinion, an edited comment, a reviewed commit the checkout
      # lacks, a header it cannot read, a failure of this step) is a new review.
      - name: o parecer herdado, quando o head só mescla a base
        id: inherit
        if: steps.app.outputs.app-slug != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ format('{0}[bot]', steps.app.outputs.app-slug) }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            | jq -c '[add[] | select(.user.login == env.AUTHOR and (.body | startswith("<!-- ahrena-review -->")))] | last // empty')"
          comment="$(jq -r '.body // empty' <<<"${found:-null}")"
          node="$(jq -r '.node_id // empty' <<<"${found:-null}")"
          # Every edit, by the comment's author: the app edits it on every review.
          edited_by_others=true
          if [ -n "$node" ]; then
            edited_by_others="$(gh api graphql --paginate --slurp -f id="$node" -f query='
              query($id: ID!, $endCursor: String) { node(id: $id) { ... on IssueComment {
                author { login }
                userContentEdits(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor } nodes { editor { login } } } } } }' \
              | jq '[.[].data.node] | if any(. == null) then true
                  else [.[] as $n | $n.userContentEdits.nodes[] | .editor.login != $n.author.login] | any end')"
          fi
          reviewed="$(grep -oE '^<sub>commit [0-9a-f]{40} · ' <<<"$comment" | tail -n1 | cut -d' ' -f2 || true)"
          header="$(grep -m1 -E '^\*\*Verdict:\*\*' <<<"$comment" || true)"
          verdict="$(sed -nE 's/^\*\*Verdict:\*\* *`([a-z_]+)`.*/\1/p' <<<"$header")"
          decision="$(sed -nE 's/.*\*\*Decisor:\*\* *`([^`]+)`.*/\1/p' <<<"$header")"
          blocking="$(grep -m1 -oE '\*\*[0-9]+\*\* bloqueantes' <<<"$comment" | tr -dc '0-9' || true)"
          # From the head down the first parents to the reviewed commit, only clean merges of the base.
          merges_only() {
            local commit="$HEAD" parents tree
            for _ in $(seq 20); do
              [ "$commit" = "$reviewed" ] && return 0
              read -r -a parents <<<"$(git rev-list --parents -n1 "$commit")"
              [ "${#parents[@]}" -eq 3 ] || return 1
              git merge-base --is-ancestor "${parents[2]}" "$BASE" || return 1
              tree="$(git merge-tree --write-tree "${parents[1]}" "${parents[2]}")" || return 1
              [ "$tree" = "$(git rev-parse "$commit^{tree}")" ] || return 1
              commit="${parents[1]}"
            done
            return 1
          }
          patch() { git diff --binary --no-color --no-ext-diff "$BASE...$1" | git patch-id --verbatim | cut -d' ' -f1; }
          inherited=false
          if [ "$edited_by_others" = false ] && [ -n "$reviewed" ] && [ "$reviewed" != "$HEAD" ] \
            && [ -n "$verdict" ] && [ -n "$decision" ] && [ -n "$blocking" ] \
            && git cat-file -e "$reviewed^{commit}" 2>/dev/null && merges_only; then
            before="$(patch "$reviewed")"
            if [ -n "$before" ] && [ "$before" = "$(patch "$HEAD")" ]; then
              inherited=true
            fi
          fi
          {
            echo "inherited=$inherited"
            if [ "$inherited" = true ]; then
              echo "reviewed=$reviewed"
              echo "verdict=$verdict"
              echo "decision=$decision"
              echo "blocking=$blocking"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: o Argos lê o PR
        id: argos
        env:
          INHERITED: ${{ steps.inherit.outputs.inherited }}
          INHERITED_VERDICT: ${{ steps.inherit.outputs.verdict }}
          INHERITED_DECISION: ${{ steps.inherit.outputs.decision }}
          INHERITED_BLOCKING: ${{ steps.inherit.outputs.blocking }}
          CLAUDE_KEY: ${{ secrets.claude-token }}
          ARGOS_MODEL: ${{ inputs.model }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          DECISOR_AUTO_MERGE_MIN: ${{ inputs.auto-merge-min }}
          DECISOR_REGRESSION_MAX: ${{ inputs.regression-max }}
          DECISOR_MAX_WARNINGS: ${{ inputs.max-warnings }}
        run: |
          # The inherited opinion stands in for the review, so the steps below read one set of outputs.
          if [ "$INHERITED" = true ]; then
            { echo "verdict=$INHERITED_VERDICT"; echo "blocking=$INHERITED_BLOCKING"
              echo "decision=$INHERITED_DECISION"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLAUDE_KEY" ]; then
            echo "::error::sem token do Claude: o caller não passou claude-token, ou o secret de org não alcança este repo"
            exit 1
          fi
          # The secret holds either kind of key, and the Argos reads each from its own variable: an API key of the
          # Console (sk-ant-api…) is ANTHROPIC_API_KEY, the token of `claude setup-token` (sk-ant-oat…) is
          # CLAUDE_CODE_OAUTH_TOKEN. Swapping the key is then only `gh secret set`, whichever it is.
          case "$CLAUDE_KEY" in
            sk-ant-api*) export ANTHROPIC_API_KEY="$CLAUDE_KEY" ;;
            *) export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_KEY" ;;
          esac
          # O checkout é do runner e o contêiner roda como root: sem o safe.directory, o git do contêiner
          # recusa o repositório («dubious ownership») e o roteamento não acha o diff.
          set +e
          docker run --rm \
            -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY -e ARGOS_MODEL -e GH_TOKEN \
            -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_API_TOKEN \
            -e DECISOR_AUTO_MERGE_MIN -e DECISOR_REGRESSION_MAX -e DECISOR_MAX_WARNINGS \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_API_URL \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" -w /repo \
            "$ARGOS_IMAGE" --pr "$PR" --changed "$BASE...$HEAD" \
            > "$RUNNER_TEMP/review.json" 2> "$RUNNER_TEMP/review.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/review.log" >&2
          if [ "$status" -ne 0 ] || ! jq -e . "$RUNNER_TEMP/review.json" >/dev/null 2>&1; then
            echo "::error::o Argos não terminou a review (saída $status); o log está acima"
            exit 1
          fi
          verdict=$(jq -r '.verdict // "comment"' "$RUNNER_TEMP/review.json")
          blocking=$(jq '[.findings[]? | select(.severity == "blocking")] | length' "$RUNNER_TEMP/review.json")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          decision=$(jq -r '.decision // "hold_for_human: sem decisor"' "$RUNNER_TEMP/review.json" | head -n1)
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      # Um comentário só por PR, editado a cada push: o marcador <!-- ahrena-review --> do runtime o acha.
      # An inherited opinion leaves the comment as it is: its time is what an admin's lift is read against.
      - name: o parecer, no PR
        if: steps.inherit.outputs.inherited != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          # Quem publica edita só o comentário que é seu: editar um comentário não muda o autor, e o parecer
          # tem de sair com a cara de quem o escreveu.
          AUTHOR: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          jq -r '.comment // empty' "$RUNNER_TEMP/review.json" > "$body"
          if [ ! -s "$body" ]; then
            { echo "<!-- ahrena-review -->"; echo "**Argos** · verdict \`${{ steps.argos.outputs.verdict }}\`"; echo
              jq -r '.summary // "(sem parecer)"' "$RUNNER_TEMP/review.json"; } > "$body"
          fi
          printf '\n<sub>commit %s · modo %s</sub>\n' "$HEAD" "${{ inputs.mode }}" >> "$body"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == env.AUTHOR and (.body | startswith("<!-- ahrena-review -->")))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" >/dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file "$body"
          fi

      # O Argos é quem decide o merge. Quando ele não libera (qualquer coisa que não seja approve com o
      # Decisor dizendo auto_merge: um bloqueante, warnings acima do corte, uma checagem vermelha, um fix
      # do Erodos ainda por revisar, ou o Argos que não rodou), o PR ganha o label argos:hold e o auto-merge
      # sai, se alguém o tinha ligado. O auto-merge.yml da org não liga o auto-merge num PR com esse label.
      # Este passo roda antes de o job terminar, e o check do Argos só fica verde no fim: o GitHub não tem
      # como mesclar entre os dois. Quando uma revisão seguinte libera, o label sai.
      - name: o argos:hold, quando o Argos não libera o merge
        # An inherited opinion leaves the label as it is, held or lifted.
        if: >-
          always()
          && steps.argos.conclusion != 'cancelled'
          && steps.inherit.outputs.inherited != 'true'
        env:
          # O label vai com o token do job (pull-requests: write); desligar o auto-merge, com o do app, que
          # é quem o liga.
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ steps.argos.outputs.verdict }}
          DECISION: ${{ steps.argos.outputs.decision }}
        run: |
          label="argos:hold"
          if [ "$VERDICT" = approve ] && [[ "$DECISION" == auto_merge* ]]; then
            gh pr edit "$PR" -R "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
            echo "o Argos libera o merge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create "$label" -R "$REPO" --color B60205 \
            --description "O Argos segurou o PR: o auto-merge fica desligado até uma revisão aprovar" >/dev/null 2>&1 || true
          gh pr edit "$PR" -R "$REPO" --add-label "$label" >/dev/null
          if [ "$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR" -R "$REPO" --disable-auto >/dev/null
            echo "auto-merge desligado" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "o Argos segura o PR (verdict \`${VERDICT:-?}\`, decisor \`${DECISION:-?}\`): label $label" >> "$GITHUB_STEP_SUMMARY"

      - name: o merge, quando o Argos aprova e o Decisor diz auto_merge
        # An inherited opinion leaves auto-merge as it is, like the hold: the label may be on the PR.
        if: >-
          inputs.auto-merge
          && steps.inherit.outputs.inherited != 'true'
          && steps.argos.outputs.verdict == 'approve'
          && startsWith(steps.argos.outputs.decision, 'auto_merge')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::o Decisor diz auto_merge, mas o app do Argos não deu token: o PR espera um humano"
            exit 0
          fi
          if gh pr merge "$PR" -R "$REPO" --squash --auto --match-head-commit "$HEAD" 2> "$RUNNER_TEMP/merge.err"; then
            echo "auto-merge ligado: o PR entra quando os checks obrigatórios passarem" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::o auto-merge não foi ligado, e o PR espera um humano: $(head -n1 "$RUNNER_TEMP/merge.err")"
          fi

      - name: o resumo
        env:
          INHERITED: ${{ steps.inherit.outputs.inherited }}
          REVIEWED: ${{ steps.inherit.outputs.reviewed }}
          VERDICT: ${{ steps.argos.outputs.verdict }}
          BLOCKING: ${{ steps.argos.outputs.blocking }}
          DECISION: ${{ steps.argos.outputs.decision }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "### Argos"
            echo "verdict \`$VERDICT\` · $BLOCKING blocking · modo \`$MODE\`"
            echo
            echo "Decisor: \`$DECISION\`"
            if [ "$INHERITED" = true ]; then
              echo
              echo "Parecer herdado de \`$REVIEWED\`: o head só mescla a base, e o diff do PR contra ela é o mesmo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: o check
        if: inputs.mode == 'block' && steps.argos.outputs.blocking != '0'
        run: |
          echo "::error::o Argos achou ${{ steps.argos.outputs.blocking }} problema(s) blocking; o parecer está no PR"
          exit 1
