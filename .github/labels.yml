# Set canônico de labels da Barte (fonte da verdade).
# TIPO de issue NÃO é label aqui — é Issue Type nativo (Task/Bug/Feature/Enhancement/
# Initiative/Epic-Milestone/Plan/Spike), gerido no nível da org.
# Este arquivo cobre o resto: size, status, qualidade/segurança e os defaults.
# O sync roda com skip-delete=true: não remove labels fora deste arquivo
# (layer:*, componente:*, cliente:*, promo:candidate ficam intactos por repo).

# --- size (auto por linhas alteradas) ---
- name: "size/XS"
  color: "0E8A16"
  description: "0-9 linhas alteradas (auto)"
- name: "size/S"
  color: "7FB800"
  description: "10-29 linhas alteradas (auto)"
- name: "size/M"
  color: "FBCA04"
  description: "30-99 linhas alteradas (auto)"
- name: "size/L"
  color: "EF9F27"
  description: "100-499 linhas alteradas (auto)"
- name: "size/XL"
  color: "E24B4A"
  description: "500-999 linhas alteradas (auto)"
- name: "size/XXL"
  color: "A32D2D"
  description: "1000+ linhas alteradas (auto)"

# --- status ---
- name: "status: todo"
  color: "ededed"
  description: "Planejado, não iniciado"
- name: "status: to review"
  color: "FBCA04"
  description: "Pronto para review"
- name: "status: development"
  color: "0E8A16"
  description: "Em desenvolvimento"
- name: "status: done"
  color: "5319E7"
  description: "Concluído (PR mergeado)"
- name: "status: to release"
  color: "0052CC"
  description: "Aguardando release"

# --- qualidade / segurança ---
- name: "security 🛡️"
  color: "B60205"
  description: "Questão de segurança"
- name: "vulnerability 🚨"
  color: "7A0000"
  description: "Vulnerabilidade detectada"
- name: "breaking change 💥"
  color: "B60205"
  description: "Mudança incompatível de contrato público (major bump)"
- name: "ci 🏗️"
  color: "0E8A16"
  description: "Mudanças de CI/CD"
- name: "release ↗️"
  color: "5319E7"
  description: "PR de release (bump + tag no merge)"
- name: "evolvability ♻️"
  color: "5319E7"
  description: "Refatoração, manutenção, evolvabilidade"
- name: "blocked 🚧"
  color: "E99695"
  description: "Bloqueado"

# --- defaults do GitHub (padronizados) ---
- name: "documentation 📃"
  color: "0075CA"
  description: "Melhorias ou adições à documentação"
- name: "duplicate"
  color: "cfd3d7"
  description: "Issue ou PR duplicada"
- name: "good first issue"
  color: "7057ff"
  description: "Bom para novatos"
- name: "help wanted"
  color: "008672"
  description: "Precisa de atenção extra"
- name: "invalid"
  color: "e4e669"
  description: "Não parece certo"
- name: "question"
  color: "d876e3"
  description: "Precisa de mais informação"
- name: "wontfix"
  color: "ffffff"
  description: "Não será trabalhado"
